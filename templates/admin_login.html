<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeni Santos Nails | Login</title>
</head>

<body>
    <main>
        <h1>Jeni Santos Nails</h1>
        <h2>Painel Administrativo</h2>

        {% if error %}
            <p>{{ error }}</p>
        {% endif %}

        <form method="post" action="/admin/login">
            <label for="password">Senha administrativa</label>

            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Entrar
            </button>
        </form>
    </main>
</body>
</html>
