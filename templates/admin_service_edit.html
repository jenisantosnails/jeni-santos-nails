<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jeni Santos Nails | Editar Serviço</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f7f7f7;
            color: #333;
        }

        header {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        header h1 {
            margin: 0 0 5px 0;
        }

        header p {
            margin: 0 0 15px 0;
            color: #666;
        }

        nav a {
            margin-right: 15px;
            text-decoration: none;
            color: #333;
        }

        main {
            max-width: 700px;
            margin: 0 auto;
        }

        .form-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-group small {
            display: block;
            margin-top: 5px;
            color: #777;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input {
            width: auto;
        }

        .error {
            background: #ffe5e5;
            color: #a12626;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button,
        .back-link {
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            box-sizing: border-box;
        }

        button {
            background: #333;
            color: white;
        }

        .back-link {
            background: #eee;
            color: #333;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .form-card {
                padding: 18px;
            }

            .actions {
                flex-direction: column;
            }

            button,
            .back-link {
                width: 100%;
                text-align: center;
            }

            nav a {
                display: block;
                margin-bottom: 10px;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>Jeni Santos Nails</h1>

    <p>Painel Administrativo</p>

    <nav>
        <a href="/admin">
            Dashboard
        </a>

        <a href="/admin/appointments">
            Agendamentos
        </a>

        <a href="/admin/clients">
            Clientes
        </a>

        <a href="/admin/services">
            Serviços
        </a>

        <a href="/admin/logout">
            Sair
        </a>
    </nav>

</header>

<main>

    <h2>Editar Serviço</h2>

    <section class="form-card">

        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}

        <form
            method="post"
            action="/admin/services/{{ service.id }}/edit"
        >

            <div class="form-group">

                <label for="name">
                    Nome do serviço
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ service.name }}"
                    maxlength="100"
                    required
                >

            </div>

            <div class="form-group">

                <label for="description">
                    Descrição
                </label>

                <textarea
                    id="description"
                    name="description"
                    maxlength="500"
                >{{ service.description or "" }}</textarea>

            </div>

            <div class="form-group">

                <label for="price">
                    Preço
                </label>

                <input
                    type="number"
                    id="price"
                    name="price"
                    value="{{ service.price }}"
                    min="0"
                    step="0.01"
                    required
                >

                <small>
                    Informe o valor em reais.
                </small>

            </div>

            <div class="form-group">

                <label for="duration_minutes">
                    Duração
                </label>

                <input
                    type="number"
                    id="duration_minutes"
                    name="duration_minutes"
                    value="{{ service.duration_minutes }}"
                    min="1"
                    step="1"
                    required
                >

                <small>
                    Informe a duração em minutos.
                </small>

            </div>

            <div class="form-group">

                <div class="checkbox-group">

                    <input
                        type="checkbox"
                        id="active"
                        name="active"
                        value="on"
                        {% if service.active %}checked{% endif %}
                    >

                    <label for="active">
                        Serviço ativo
                    </label>

                </div>

            </div>

            <div class="actions">

                <button type="submit">
                    Salvar alterações
                </button>

                <a
                    class="back-link"
                    href="/admin/services"
                >
                    Voltar para serviços
                </a>

            </div>

        </form>

    </section>

</main>

</body>

</html>
